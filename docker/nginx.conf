worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    upstream repoinfo_api { server api:8000 keepalive 32; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 100M;

        # ---- REST API ----
        location /api/ {
            proxy_pass http://repoinfo_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        # ---- SSE streams (chat + analysis progress) ----
        location ~ ^/api/v1/(chat/conversations/.+/(stream|messages/.+/regenerate|messages))$ {
            proxy_pass http://repoinfo_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no;
        }

        # ---- WebSocket ----
        location /ws {
            proxy_pass http://repoinfo_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 24h;
        }

        location = /metrics { proxy_pass http://repoinfo_api; }
        location = /health  { proxy_pass http://repoinfo_api; }
    }
}
